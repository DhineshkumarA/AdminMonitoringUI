<div class="dashboard">
  <app-header></app-header>
  <app-module-bar
    [designersOnline]="dashboardData?.designersOnline ?? 0"
    [spoolQueueStatus]="dashboardData?.spoolQueueStatus ?? 'HEALTHY'"
  ></app-module-bar>

  <main class="main-content">
    <app-summary-cards [dashboardData]="dashboardData"></app-summary-cards>

    <app-charts-grid
      [dashboardData]="dashboardData"
      (companyClick)="onCompanySelected($event)"
      (categoryClick)="onCategorySelected($event)"
    ></app-charts-grid>

    @if (selectedCompany) {
      <app-company-users-modal
        [company]="selectedCompany"
        [users]="companyUsers"
        [isLoading]="isLoadingCompanyUsers"
        (close)="closeCompanyModal()"
        (userSelect)="onCompanyUserSelected($event)"
      ></app-company-users-modal>
    }

    @if (selectedCategoryName) {
      <app-category-templates-modal
        [categoryName]="selectedCategoryName"
        [templates]="categoryTemplates"
        [isLoading]="isLoadingCategoryTemplates"
        (close)="closeCategoryModal()"
        (templateSelect)="onTemplateSelected($event)"
      ></app-category-templates-modal>
    }

    @if (selectedTemplate) {
      <app-template-labels-modal
        [template]="selectedTemplate"
        [labels]="templateLabels"
        [isLoading]="isLoadingTemplateLabels"
        (close)="closeTemplateLabelsModal()"
        (userSelect)="onLabelUserSelected($event)"
      ></app-template-labels-modal>
    }

    @if (selectedUser) {
      <app-user-detail-modal
        [user]="selectedUser"
        (close)="closeUserModal()"
      ></app-user-detail-modal>
    }
  </main>

  <app-footer [dashboardData]="dashboardData"></app-footer>
</div>
