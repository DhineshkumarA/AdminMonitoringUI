<div class="module-bar">
  <div class="module-title">
    <span class="module-dot"></span>
    {{ moduleTitle }}
  </div>

  <div class="module-status">
    <span class="status-item online-status">
      <span class="pulse-dot"></span>
      Designers Online: <strong>{{ designersOnline }}</strong>
    </span>
    <span class="status-item spool-status">
      Spool Queue:
      <strong
        [class.status-healthy]="spoolQueueStatus === 'HEALTHY'"
        [class.status-warning]="spoolQueueStatus === 'WARNING'"
        [class.status-critical]="spoolQueueStatus === 'CRITICAL'"
      >{{ spoolQueueStatus }}</strong>
    </span>
  </div>
</div>
